plugins {
	id 'fabric-loom' version '1.18.2' apply false
	id 'net.fabricmc.fabric-loom' version '1.18.2' apply false
}

subprojects {
	def modern = project.minecraft_version.startsWith('26')
	apply plugin: modern ? 'net.fabricmc.fabric-loom' : 'fabric-loom'

	version = "${rootProject.mod_version}+${project.minecraft_version}"
	group = rootProject.maven_group

	base {
		archivesName = rootProject.archives_base_name
	}

	sourceSets {
		main {
			java.srcDirs += rootProject.file('shared/java')
			java.srcDirs += rootProject.file(modern ? 'common26/java' : 'common/java')
			resources.srcDirs += rootProject.file('common/resources')
		}
	}

	dependencies {
		minecraft "com.mojang:minecraft:${project.minecraft_version}"
		if (modern) {
			implementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
			implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
		} else {
			mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
			modImplementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
			modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
		}
	}

	processResources {
		def props = [version: rootProject.mod_version, minecraft: project.minecraft_range]
		inputs.properties props
		filesMatching("fabric.mod.json") {
			expand props
		}
	}

	def javaVersion = modern ? 25 : 21

	tasks.withType(JavaCompile).configureEach {
		it.options.release = javaVersion
	}

	java {
		sourceCompatibility = JavaVersion.toVersion(javaVersion)
		targetCompatibility = JavaVersion.toVersion(javaVersion)
	}

	tasks.register('bundle', Copy) {
		def built = modern ? tasks.named('jar') : tasks.named('remapJar')
		dependsOn built
		from built.flatMap { it.archiveFile }
		into rootProject.file('../data/mods')
		rename { "oppaclient-${project.minecraft_version}.jar" }
	}
}
