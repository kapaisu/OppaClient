<main>
<img src="icon.png" alt="">
<h1>Oppa</h1>
<p>Minecraft launcher with its own in-game mod.</p>
<pre>flatpak remote-add --user --if-not-exists oppa https://kapaisu.github.io/OppaClient/oppa.flatpakrepo
flatpak install --user oppa dev.oppa.Launcher</pre>
<p>Or open <a href="dev.oppa.Launcher.flatpakref">dev.oppa.Launcher.flatpakref</a> in your software store. <a href="https://github.com/kapaisu/OppaClient">Source</a></p>
